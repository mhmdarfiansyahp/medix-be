info:
  name: Update obat
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/medicines/1"
  body:
    type: json
    data: |-
      {
        "nama_obat": "Paracetamol Extra 500mg",
        "harga": 18000,
        "stok": 45,
        "jenis_obat_id": 2,
        "barcode": "8991234567892"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
