info:
  name: Get data by Barcode
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/medicines?barcode=8991234567890"
  params:
    - name: barcode
      value: "8991234567890"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
