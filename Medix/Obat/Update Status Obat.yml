info:
  name: Update Status Obat
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/medicines/2/status"
  body:
    type: json
    data: |-
      {
        "is_active": false
      }
  auth: inherit

runtime:
