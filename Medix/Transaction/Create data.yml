info:
  name: Create data
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/transactions"
  body:
    type: json
    data: |-
      {
        "id_user": 3,
        "details": [
          {
            "id_obat": 1,
            "jumlah": 2,
            "harga_satuan": 15000.00
          }
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
